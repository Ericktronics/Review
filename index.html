<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Dev Flashcards</title>
    <script>
      // Apply the theme before first paint so the page never flashes the wrong one; dark unless light was chosen
      var theme = 'dark';
      try {
        if (JSON.parse(localStorage.getItem('flashcards.theme')) === 'light') theme = 'light';
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
